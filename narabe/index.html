<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>チバトル並べ｜チバトル</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../desktop-ui.css?v=0.26.0">
  <link rel="stylesheet" href="lobby.css?v=0.32.0-room-3">
  <link rel="stylesheet" href="../draw-animation.css">
  <link rel="stylesheet" href="battle.css">
  <script defer src="../hand-drag-visuals.js"></script>
  <script defer src="../draw-animation.js"></script>
  <script defer src="../card-face.js"></script>
  <script defer src="original-card.js"></script>
  <script defer src="../server/narabe-cards.js"></script><script defer src="../server/narabe-specials.js"></script><script defer src="../server/narabe-engine.js"></script><script defer src="app.js?v=0.32.0-room-3"></script>
</head>
<body class="computer-active">
  <main>
    <section id="narabeComputer" class="mode-computer" aria-label="チバトル並べのPC">
      <div class="computer-display"><div class="computer-content"><div class="narabe-lobby-content">
    <header><a class="back" href="../index.html">‹ チバトルへ</a><span class="mode-tag">チバトル並べ</span><span class="brand">チバトル</span></header>
    <section id="lobby">
      <div class="match-grid">
        <section class="panel room-panel">
          <div id="disconnected">
            <div class="directory-toolbar"><h1>チバトル並べ</h1><button id="quickMatch" class="primary" disabled>すぐに対戦</button><button id="create" class="primary" disabled>部屋を作る</button><button id="solo" class="secondary" disabled>CPUと対戦</button><button id="refreshRooms" class="secondary" type="button">更新</button></div>
            <div class="directory-meta"><label for="name">名前<input id="name" maxlength="20" value="チバトル学生" autocomplete="nickname"></label><label for="total">人数<select id="total"><option value="4" selected>4人</option><option value="5">5人</option><option value="6">6人</option></select></label><span id="roomListCount" aria-live="polite">0ルーム</span></div>
            <div id="roomList" class="room-directory" aria-label="募集中の部屋"><p class="directory-empty">読込中…</p></div>
            <details class="code-entry"><summary>部屋番号で入室</summary><form id="joinForm"><label for="code">部屋番号</label><div class="join-row"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6桁の部屋番号" required><button id="join" class="secondary" disabled>入室</button></div></form></details>
          </div>
          <div id="connected" hidden>
            <div class="waiting-heading"><h2 id="roomTitle">みんなの部屋</h2><div class="waiting-meta"><span class="room-number"><span>部屋番号</span><button id="copy" title="部屋番号をコピー">------</button></span><span id="roomCount" aria-label="参加人数"></span></div></div>
            <div class="waiting-body"><div class="waiting-seats"><div id="people" class="people" aria-label="参加者と空席"></div><button id="addSeat" class="secondary add-seat" type="button" aria-label="席を1つ増やす">＋</button></div></div>
            <div class="room-actions"><button id="ready" class="secondary">準備OK</button><button id="start" class="primary">ゲームスタート</button><button id="leave" class="secondary">退室</button></div>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
          <details id="connectionSettings"><summary>接続先の設定</summary><label for="endpoint">サーバーURL</label><input id="endpoint" type="url"></details>
        </section>
      </div>
    </section>
        <footer>CHIBATORU · チバトル並べ</footer>
      </div></div></div>
      <div class="computer-base" aria-hidden="true"><img src="../assets/tutorial/laptop-keyboard-graphite-us.svg" alt="" draggable="false"></div>
    </section>
    <section id="battle" hidden aria-label="チバトル並べ対戦画面">
      <button id="menuButton" class="battle-corner menu-button" type="button" aria-expanded="false" aria-controls="menuDrawer">MENU</button>
      <div class="battle-title"><strong>チバトル並べ</strong><span id="turnEffects">パス制限 3回</span></div>
      <button id="logButton" class="battle-corner log-button" type="button" aria-expanded="false" aria-controls="logDrawer">ログ</button>
      <aside id="players" class="players" aria-label="相手の手札と情報"></aside>
      <section class="table-panel" aria-label="七並べの場">
        <div class="table-label"><span>場</span><span id="placedCount"></span></div>
        <div class="table-scroll"><div id="table" class="table"></div></div>
        <div id="dealSource" class="deal-source" aria-label="配札元"><img src="../assets/card-back.png" alt=""><span>配札中</span></div>
        <aside class="self-controls" aria-label="自分の情報とパス権">
          <div id="selfInfo" class="self-info"><strong id="selfName"></strong><div><span id="selfPasses"></span><span id="handCount"></span></div></div>
          <button id="pass" class="secondary">パス</button>
        </aside>
      </section>
      <section class="self-area" aria-label="自分の手札と情報">
        <div class="normal-hand-area"><span class="hand-label">通常カード</span><div class="hand-window"><div id="hand" class="hand"></div></div></div>
        <div class="special-hand-area"><span class="hand-label" id="specialLabel">専用カード</span><div id="specialHand" class="special-hand"></div></div>
      </section>
      <button id="selectionReturn" class="selection-return" type="button" hidden>選択画面に戻る</button>
      <div id="specialReveal" class="special-reveal" hidden aria-live="polite"><div id="specialRevealCard"></div><p id="specialRevealName"></p></div>
      <div class="battle-message" aria-live="polite"><strong id="turn">あなたの番です</strong><span id="handHelp">出すカードを選んでください。</span><span id="gameStatus" role="status"></span></div>
      <aside id="menuDrawer" class="battle-drawer menu-drawer" hidden aria-label="メニュー"><div class="drawer-head"><strong>MENU</strong><button id="menuClose" type="button">閉じる</button></div><button id="quit" class="secondary">開始画面へ</button><button id="specialHelp" class="secondary">専用カードのルール</button><p class="small">通常カードは戦意5からタイプごとにつなげます。専用カードは通常配置前に1枚まで使用可能です。通常手札が0枚であがり。空席は配置済みとして扱います。</p></aside>
      <section id="specialDialog" class="special-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="specialTitle"><div class="special-modal"><div class="drawer-head"><strong id="specialTitle"></strong><button id="selectionPeek" type="button" aria-label="盤面を見る" title="盤面を見る">◉ 盤面を見る</button><button id="specialClose" type="button">閉じる</button></div><p id="specialText"></p><div id="specialOptions" class="special-options"></div><div class="special-dialog-actions"><button id="specialConfirm" type="button" class="primary">使用する</button></div></div></section>
      <aside id="logDrawer" class="battle-drawer log-drawer" hidden aria-label="ログ"><div class="drawer-head"><strong>ログ</strong><button id="logClose" type="button">閉じる</button></div><ol id="logs"></ol></aside>
      <aside id="cardPreview" class="battle-drawer card-preview" hidden aria-label="カード確認"><div class="drawer-head"><strong>カード確認</strong><button id="previewClose" type="button">閉じる</button></div><div id="previewCard"></div><p id="previewName"></p><p class="small">能力は発動しません。攻撃力・体力も配置や勝敗の判定には使いません。</p></aside>
      <section id="results" class="result-overlay" hidden><div class="panel"><h2>結果</h2><ol id="rankings"></ol><button id="resultBack" class="primary">開始画面へ</button></div></section>
    </section>
  </main>
</body>
</html>
